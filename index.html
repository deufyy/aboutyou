<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #f1f1f1;
            font-family: 'Plus Jakarta+Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container utama: Responsif di HP maupun Laptop */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px; /* Lebar maksimal ala bingkai ponsel di layar PC */
            max-height: 100vh;
            background: #030303;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        @media (min-width: 768px) {
            .container {
                height: 90vh;
                max-height: 850px;
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        /* --- LANDING PAGE GAYA BARU (MINIMALIS ESTETIK) --- */
        .landing-page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            z-index: 3;
            background: radial-gradient(circle, #1a1a1a 0%, #080808 100%);
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }

        .landing-title {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            font-weight: 500;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .landing-desc {
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        /* Tombol dengan Animasi Elegan */
        .explore-btn {
            background: #ffffff;
            color: #030303;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
        }

        .explore-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
        }

        /* --- ANIMASI TRANSISI KELUAR --- */
        .landing-page.slide-up {
            transform: translateY(-100%);
            opacity: 0;
        }

        /* --- HALAMAN PEMUTAR VIDEO --- */
        .player-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: scale(1.05);
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .player-page.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        video.bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Menyesuaikan layar laptop dan HP tanpa gepeng */
        }

        /* Tombol Pause di tengah video */
        .pause-overlay {
            position: absolute;
            z-index: 4;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-page:hover .pause-overlay {
            opacity: 1;
        }

        .pause-icon {
            width: 12px;
            height: 16px;
            border-left: 3.5px solid white;
            border-right: 3.5px solid white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LANDING PAGE GAYA BARU -->
        <div id="landingPage" class="landing-page">
            <div class="badge">Experience</div>
            <div class="landing-title">About You</div>
            <div class="landing-desc">Tekan tombol di bawah untuk memulai</div>
            <button class="explore-btn" onclick="startExperience()">Mulai</button>
        </div>

        <!-- HALAMAN PEMUTAR VIDEO -->
        <div id="playerPage" class="player-page" onclick="togglePause()">
            <video id="myVideo" class="bg-video" playsinline loop>
                <source src="video-lirik.mp4" type="video/mp4">
                Browser kamu tidak mendukung tag video.
            </video>
            <div id="pauseOverlay" class="pause-overlay">
                <div class="pause-icon"></div>
            </div>
        </div>
    </div>

    <script>
        const landingPage = document.getElementById('landingPage');
        const playerPage = document.getElementById('playerPage');
        const video = document.getElementById('myVideo');
        const pauseOverlay = document.getElementById('pauseOverlay');

        function startExperience() {
            // Menjalankan animasi transisi geser ke atas
            landingPage.classList.add('slide-up');
            playerPage.classList.add('active');
            video.play();
        }

        function togglePause() {
            if (!video.paused) {
                video.pause();
                pauseOverlay.style.opacity = 1;
            } else {
                video.play();
                pauseOverlay.style.opacity = 0;
            }
        }
    </script>

</body>
</html>
