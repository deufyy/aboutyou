<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Lirik Estetik</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Bingkai yang otomatis menyesuaikan layar HP */
        .phone-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 414px;
            max-height: 896px;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video memenuhi layar HP */
        video.bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Tombol Play Kustom di tengah */
        .play-btn {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* Ikon Segitiga Play */
        .play-icon {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid white;
            margin-left: 4px;
        }

        /* Ikon Jeda (Pause) */
        .pause-icon {
            display: none;
            width: 16px;
            height: 22px;
            border-left: 5px solid white;
            border-right: 5px solid white;
        }

        /* Mengubah ikon saat video berputar */
        .playing .play-icon {
            display: none;
        }
        .playing .pause-icon {
            display: block;
        }

        /* Sembunyikan tombol saat video dimainkan agar tidak menghalangi video */
        .playing.play-btn {
            opacity: 0;
            pointer-events: none; /* Tombol bisa diklik lagi jika video disentuh/di-pause */
        }

        .phone-frame:hover .play-btn {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="phone-frame" onclick="togglePlay()">
        <!-- Video TikTok Kamu -->
        <video id="myVideo" class="bg-video" playsinline loop>
            <source src="video-lirik.mp4" type="video/mp4">
            Browser kamu tidak mendukung tag video.
        </video>

        <!-- Tombol Play -->
        <div id="playButton" class="play-btn">
            <div class="play-icon"></div>
            <div class="pause-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const playButton = document.getElementById('playButton');

        function togglePlay() {
            if (video.paused) {
                video.play();
                playButton.classList.add('playing');
            } else {
                video.pause();
                playButton.classList.remove('playing');
            }
        }

        // Jika video selesai atau di-pause manual
        video.addEventListener('pause', () => {
            playButton.classList.remove('playing');
        });
    </script>

</body>
</html>
