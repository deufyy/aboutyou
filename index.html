<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 100vh;
            background: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
        }

        @media (min-width: 768px) {
            .container {
                height: 90vh;
                max-height: 850px;
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }

        /* --- LANDING PAGE --- */
        .landing-page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            z-index: 3;
            background: linear-gradient(135deg, #2b2b2b 0%, #111111 50%, #000000 100%);
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
        }

        .landing-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .landing-title span {
            color: #b0b0b0;
        }

        .github-tag {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .landing-desc {
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .explore-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.2);
        }

        .explore-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 255, 255, 0.4);
        }

        .landing-page.slide-up {
            transform: translateY(-100%);
            opacity: 0;
        }

        /* --- HALAMAN PEMUTAR VIDEO --- */
        .player-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: scale(1.05);
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .player-page.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        video.bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- NAVBAR PERSIS IG STORY --- */
        .ig-navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 12px 0 12px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        }

        /* Progress Bar */
        .progress-bars {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .bar {
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #ffffff;
        }

        /* Header Info Profil & Tombol Aksi */
        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .story-user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .story-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px; /* Efek border gradasi Instagram */
        }

        .story-avatar-inner {
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        .story-text-group {
            display: flex;
            flex-direction: column;
        }

        .story-username-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .story-username {
            font-size: 12.5px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .verified-badge {
            width: 11px;
            height: 11px;
            fill: #3897f0;
        }

        .story-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .story-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .action-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
        }

        /* Tombol Pause di tengah video */
        .pause-overlay {
            position: absolute;
            z-index: 4;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-page:hover .pause-overlay {
            opacity: 1;
        }

        .pause-icon {
            width: 12px;
            height: 16px;
            border-left: 3.5px solid white;
            border-right: 3.5px solid white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LANDING PAGE -->
        <div id="landingPage" class="landing-page">
            <div class="badge">Soundtrack</div>
            <div class="landing-title">About <span>You</span></div>
            <div class="github-tag">github.com/deufyy</div>
            <div class="landing-desc">Tekan tombol di bawah untuk mendengarkan</div>
            <button class="explore-btn" onclick="startExperience()">Mulai</button>
        </div>

        <!-- HALAMAN PEMUTAR VIDEO + NAVBAR IG STORY -->
        <div id="playerPage" class="player-page" onclick="togglePause(event)">
            
            <!-- Navbar Atas Ala Instagram Story -->
            <div class="ig-navbar">
                <div class="progress-bars">
                    <div class="bar"><div id="barFill" class="bar-fill"></div></div>
                </div>
                <div class="story-header">
                    <div class="story-user-info">
                        <div class="story-avatar">
                            <div class="story-avatar-inner">D</div>
                        </div>
                        <div class="story-text-group">
                            <div class="story-username-row">
                                <span class="story-username">deufyy</span>
                                <!-- Centang biru Instagram -->
                                <svg class="verified-badge" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6.3 13l1.4-1.4 2.4 2.4 5.9-5.9 1.4 1.4-7.3 7.3z"/></svg>
                            </div>
                            <span class="story-time">35m</span>
                        </div>
                    </div>
                    
                    <div class="story-actions">
                        <!-- Tombol Pause/Play Audio (ikon speaker) -->
                        <button class="action-icon-btn" id="audioToggleBtn" onclick="toggleAudio(event)" title="Mute/Unmute">
                            <svg id="speakerIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <!-- Tombol Tutup (Silang) -->
                        <button class="action-icon-btn" onclick="resetExperience(event)" title="Tutup">
                            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Video -->
            <video id="myVideo" class="bg-video" playsinline>
                <source src="video-lirik.mp4" type="video/mp4">
                Browser kamu tidak mendukung tag video.
            </video>
            
            <!-- Tombol Jeda Tengah -->
            <div id="pauseOverlay" class="pause-overlay">
                <div class="pause-icon"></div>
            </div>
        </div>
    </div>

    <script>
        const landingPage = document.getElementById('landingPage');
        const playerPage = document.getElementById('playerPage');
        const video = document.getElementById('myVideo');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const barFill = document.getElementById('barFill');
        const speakerIcon = document.getElementById('speakerIcon');

        function startExperience() {
            landingPage.classList.add('slide-up');
            playerPage.classList.add('active');
            video.currentTime = 0;
            video.muted = false; // Memastikan suara aktif
            video.play();
            updateSpeakerIcon();
        }

        function togglePause(e) {
            // Jika yang diklik adalah area navbar atas, abaikan fungsi pause video
            if (e.target.closest('.ig-navbar')) return;

            if (!video.paused) {
                video.pause();
                pauseOverlay.style.opacity = 1;
            } else {
                video.play();
                pauseOverlay.style.opacity = 0;
            }
        }

        function toggleAudio(e) {
            e.stopPropagation(); // Mencegah video ikut ter-pause
            video.muted = !video.muted;
            updateSpeakerIcon();
        }

        function updateSpeakerIcon() {
            if (video.muted) {
                // Ikon Mute (Speaker dicoret)
                speakerIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C22.63 14.85 23 13.48 23 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else {
                // Ikon Normal (Speaker aktif)
                speakerIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            }
        }

        function resetExperience(e) {
            e.stopPropagation();
            video.pause();
            playerPage.classList.remove('active');
            landingPage.classList.remove('slide-up');
            barFill.style.width = '0%';
            pauseOverlay.style.opacity = 0;
        }

        // Progress bar jalan otomatis mengikuti durasi video
        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                let percentage = (video.currentTime / video.duration) * 100;
                barFill.style.width = percentage + '%';
            }
        });

        // Kembali ke landing page otomatis saat video habis
        video.addEventListener('ended', () => {
            playerPage.classList.remove('active');
            landingPage.classList.remove('slide-up');
            barFill.style.width = '0%';
        });
    </script>

</body>
</html>
