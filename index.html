<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 100vh;
            background: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
        }

        @media (min-width: 768px) {
            .container {
                height: 90vh;
                max-height: 850px;
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }

        /* --- LANDING PAGE --- */
        .landing-page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            z-index: 3;
            background: linear-gradient(135deg, #2b2b2b 0%, #111111 50%, #000000 100%);
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
        }

        .landing-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .landing-title span {
            color: #b0b0b0;
        }

        .landing-desc {
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Tambahan nama GitHub di landing page */
        .github-tag {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .explore-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.2);
        }

        .explore-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 255, 255, 0.4);
        }

        .landing-page.slide-up {
            transform: translateY(-100%);
            opacity: 0;
        }

        /* --- HALAMAN PEMUTAR VIDEO --- */
        .player-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: scale(1.05);
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .player-page.active {
            opacity: 1;
            transform: scale(1);
            z-index: 2;
        }

        video.bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- NAVBAR ALA STORY INSTAGRAM --- */
        .ig-navbar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Garis-garis progress bar */
        .progress-bars {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .bar {
            flex: 1;
            height: 2.5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #ffffff;
        }

        /* Bagian Profil & Tombol Tutup */
        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .story-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .story-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
        }

        .story-username {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            padding: 0 5px;
        }

        /* Tombol Pause di tengah video */
        .pause-overlay {
            position: absolute;
            z-index: 4;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-page:hover .pause-overlay {
            opacity: 1;
        }

        .pause-icon {
            width: 12px;
            height: 16px;
            border-left: 3.5px solid white;
            border-right: 3.5px solid white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LANDING PAGE DENGAN NAMA GITHUB -->
        <div id="landingPage" class="landing-page">
            <div class="badge">Soundtrack</div>
            <div class="landing-title">About <span>You</span></div>
            <div class="github-tag">github.com/deufyy</div>
            <div class="landing-desc">Tekan tombol di bawah untuk mendengarkan</div>
            <button class="explore-btn" onclick="startExperience()">Mulai</button>
        </div>

        <!-- HALAMAN PEMUTAR VIDEO + INSTAGRAM STORY NAVBAR -->
        <div id="playerPage" class="player-page" onclick="togglePause()">
            <!-- Navbar ala Story IG -->
            <div class="ig-navbar">
                <div class="progress-bars">
                    <div class="bar"><div id="barFill" class="bar-fill"></div></div>
                </div>
                <div class="story-header">
                    <div class="story-user">
                        <div class="story-avatar">D</div>
                        <span class="story-username">deufyy</span>
                    </div>
                    <button class="close-btn" onclick="resetExperience(event)">&times;</button>
                </div>
            </div>

            <video id="myVideo" class="bg-video" playsinline>
                <source src="video-lirik.mp4" type="video/mp4">
                Browser kamu tidak mendukung tag video.
            </video>
            
            <div id="pauseOverlay" class="pause-overlay">
                <div class="pause-icon"></div>
            </div>
        </div>
    </div>

    <script>
        const landingPage = document.getElementById('landingPage');
        const playerPage = document.getElementById('playerPage');
        const video = document.getElementById('myVideo');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const barFill = document.getElementById('barFill');

        function startExperience() {
            landingPage.classList.add('slide-up');
            playerPage.classList.add('active');
            video.currentTime = 0;
            video.play();
        }

        function togglePause(e) {
            // Mencegah tombol close ikut memicu pause video
            if (e.target.classList.contains('close-btn')) return;

            if (!video.paused) {
                video.pause();
                pauseOverlay.style.opacity = 1;
            } else {
                video.play();
                pauseOverlay.style.opacity = 0;
            }
        }

        function resetExperience(e) {
            e.stopPropagation(); // Mencegah fungsi pause ikut terpanggil
            video.pause();
            playerPage.classList.remove('active');
            landingPage.classList.remove('slide-up');
            barFill.style.width = '0%';
            pauseOverlay.style.opacity = 0;
        }

        // Mengisi progress bar navbar ala Story IG seiring durasi video berjalan
        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                let percentage = (video.currentTime / video.duration) * 100;
                barFill.style.width = percentage + '%';
            }
        });

        // Jika video selesai, kembali ke landing page secara otomatis
        video.addEventListener('ended', () => {
            playerPage.classList.remove('active');
            landingPage.classList.remove('slide-up');
            barFill.style.width = '0%';
        });
    </script>

</body>
</html>
