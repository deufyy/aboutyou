<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About You</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 414px;
            max-height: 896px;
            background: #0b0b0b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- TAMPILAN AWAL (LANDING PAGE) --- */
        .landing-page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 3;
            background: #0b0b0b;
            transition: opacity 0.5s ease;
        }

        .title-text {
            font-size: 42px;
            font-style: italic;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 15px;
            color: #f4eee2;
        }

        .title-text span {
            color: #d4a373;
        }

        .subtitle-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .listen-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 35px;
            border-radius: 30px;
            font-family: 'Playfair Display', serif;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .listen-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .footer-note {
            position: absolute;
            bottom: 25px;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        /* --- TAMPILAN PEMUTAR VIDEO --- */
        .player-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .player-page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        video.bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pause-overlay {
            position: absolute;
            z-index: 4;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .player-page:hover .pause-overlay {
            opacity: 1;
        }

        .pause-icon {
            width: 14px;
            height: 18px;
            border-left: 4px solid white;
            border-right: 4px solid white;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HALAMAN AWAL (LANDING PAGE) -->
        <div id="landingPage" class="landing-page">
            <div class="title-text">
                About <span>You</span>
            </div>
            <div class="subtitle-text">Biarkan lagunya yang berbicara.</div>
            <button class="listen-btn" onclick="startExperience()">Dengarkan</button>
            <div class="footer-note">Music &bull; Aesthetics</div>
        </div>

        <!-- HALAMAN PEMUTAR VIDEO -->
        <div id="playerPage" class="player-page" onclick="togglePause()">
            <video id="myVideo" class="bg-video" playsinline loop>
                <source src="video-lirik.mp4" type="video/mp4">
                Browser kamu tidak mendukung tag video.
            </video>
            <div id="pauseOverlay" class="pause-overlay">
                <div class="pause-icon"></div>
            </div>
        </div>
    </div>

    <script>
        const landingPage = document.getElementById('landingPage');
        const playerPage = document.getElementById('playerPage');
        const video = document.getElementById('myVideo');
        const pauseOverlay = document.getElementById('pauseOverlay');

        function startExperience() {
            landingPage.classList.add('fade-out');
            playerPage.classList.add('active');
            video.play();
        }

        function togglePause() {
            if (!video.paused) {
                video.pause();
                pauseOverlay.style.opacity = 1;
            } else {
                video.play();
                pauseOverlay.style.opacity = 0;
            }
        }
    </script>

</body>
</html>
