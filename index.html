<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Start</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Bingkai utama ukuran layar HP */
        .phone-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 414px;
            max-height: 896px;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video latar belakang */
        video.bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.45); /* Menggelapkan video agar tombol makin kontras */
            z-index: 1;
        }

        /* Kotak Pembungkus Ala Card Login yang Estetik */
        .login-card {
            position: relative;
            z-index: 2;
            width: 85%;
            max-width: 300px;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.5s ease;
        }

        .login-card h2 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Tombol Mulai Estetik */
        .start-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .start-btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* Efek saat card menghilang setelah tombol diklik */
        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Video Latar Belakang -->
        <video id="myVideo" class="bg-video" playsinline loop>
            <source src="video-lirik.mp4" type="video/mp4">
            Browser kamu tidak mendukung tag video.
        </video>

        <!-- Kotak Tombol Estetik ala Card Login -->
        <div id="loginCard" class="login-card">
            <h2>Soundtrack</h2>
            <p>Ketuk untuk mendengarkan</p>
            <button class="start-btn" onclick="playMusic()">Mulai</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const loginCard = document.getElementById('loginCard');

        function playMusic() {
            video.play();
            // Card tombol akan memudar dan hilang secara mulus saat video diputar
            loginCard.classList.add('hidden');
        }

        // Jika video di-pause atau selesai, card tombolnya bisa muncul lagi kalau layar disentuh
        video.addEventListener('pause', () => {
            loginCard.classList.remove('hidden');
        });
    </script>

</body>
</html>
